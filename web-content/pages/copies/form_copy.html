<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>

        <link rel="stylesheet" href="../style.css">
</head>
<body>

    <nav>
     <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="indexInClass.html">About Me</a></li>
        <li><a href="#">Form</a></li>
    </ul>
    </nav>


    <form action="" method="get">
    <table>

        <tr>
            <td><label for="first_name">First Name</label></td>
            <td><input type="text" name="first_name" id=""></td>
        </tr>
        <tr>
            <td><label for="last_name">Last Name</label></td>
            <td><input type="text" name="last_name" id=""></td>
        </tr>
        <tr>
            <td><label for="email">Email</label></td>
            <td><input type="email" name="email" id=""></td>
        </tr>
        <tr>
            <td><label for="salary">Expected Salary</label></td>
            <td><input type="number" name="salary" id=""></td>
        </tr>
        <tr>
            <td><label for="language">Choose your favorite language:</label></td>
            <td>
                <input type="radio" name="language" id="" value="Java"><label for="">Java</label>
                <input type="radio" name="language" id="" value="C++"><label for="">C++</label>
                <input type="radio" name="language" id="" value="Python"><label for="">Python</label>
                <input type="radio" name="language" id="" value="Rust"><label for="">Rust</label>
            </td>
        </tr>
        <tr>
            <td><label for="Experience"></label>How much experience do you have?</td>
            <td>
                <select name="Experience" id="">
                    
                <option value="less_than_1_year">Less than one year</option>
                <option value="1_to_3_years">One to three years</option>
                <option value="3_to_5_years">Three to five years</option>
                <option value="5+_years">Five or more years</option>
                </select>
            </td>
        </tr>

        <tr>
           <td><label for="Skills"></label>Select any skills you have:</td>
          
           <td>
                <input type="checkbox" id="skill1" name="skill1" value="Math">
                <label for="skill1"> Math</label>
                <input type="checkbox" id="skill2" name="skill2" value="Communication">
                <label for="skill2"> Communication</label>
                <input type="checkbox" id="skill3" name="skill3" value="Time-Management">
                <label for="skill3"> Time-Management</label>
                <input type="checkbox" id="skill4" name="skill4" value="Attention to Detail">
                <label for="skill4"> Attention to Detail</label>
                <input type="checkbox" id="skill5" name="skill5" value="Work Ethic">
                <label for="skill5"> Work Ethic</label>
           </td>
        </tr>

        <tr>
            <td><label for="user_paragraph">Why are you a good fit for this job?</label></td>
            <td><textarea name="user_paragraph" id=""></textarea></td>
        </tr>
        <tr>
            <td><input type="submit" value="Submit"></td>
            <td><input type="reset" value="Clear"></td>
        </tr>

    </table>

    </form>
</body>
</html>
